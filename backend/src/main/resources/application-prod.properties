# MongoDB Configuration (Production)
# Connection URI is built programmatically in MongoConfig.java
# which URL-encodes MONGODB_USER and MONGODB_PASSWORD automatically.
# Override the base application.properties localhost URI so it is ignored in prod.
spring.data.mongodb.uri=
spring.data.mongodb.database=findmyjob
spring.data.mongodb.auto-index-creation=true

# Server Configuration
server.port=${PORT:8080}

# CORS Configuration for Production
spring.web.cors.allowed-origin-patterns=http://localhost:*,https://*.vercel.app,https://placementbabai.online,https://www.placementbabai.online,https://main.d1smp3vpptz385.amplifyapp.com
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=false
