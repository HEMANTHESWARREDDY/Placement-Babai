name: Build and Deploy to EC2

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: Build with Maven
      run: |
        cd backend
        mvn clean package -DskipTests
        
    - name: Upload JAR
      uses: actions/upload-artifact@v4
      with:
        name: findmyjob-backend
        path: backend/target/*.jar

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
    - name: Download JAR
      uses: actions/download-artifact@v4
      with:
        name: findmyjob-backend
        path: target/
        
    - name: Deploy to EC2
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "target/*.jar"
        target: "/home/${{ secrets.EC2_USERNAME }}/app/"
        strip_components: 1

    - name: Restart Service
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          echo "🌐 EC2 Public IP: $(curl -s ifconfig.me)"
          echo "Cleaning up old processes..."
          pkill -f '[f]indmyjob-backend' || true
          sudo fuser -k 8080/tcp || true
          kill -9 $(lsof -t -i:8080) 2>/dev/null || true
          sleep 2
          
          echo "Starting application with Secrets..."
          cd $HOME/app/
          rm -f app.log
          
          # Find the latest deployed jar to prevent conflicts
          LATEST_JAR=$(ls -t *.jar | head -n1)
          echo "Running latest jar: $LATEST_JAR"

          # Pass secrets inline so nohup inherits them correctly
          nohup env \
            MONGODB_PASSWORD="${{ secrets.MONGODB_PASSWORD }}" \
            MONGODB_USER="${{ secrets.MONGODB_USER }}" \
            GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            MAIL_USERNAME="${{ secrets.MAIL_USERNAME }}" \
            MAIL_PASSWORD="${{ secrets.MAIL_PASSWORD }}" \
            java -jar -Dspring.profiles.active=prod "$LATEST_JAR" > app.log 2>&1 &
          
          echo "Verifying startup (waiting 30s)..."
          sleep 30
          if pgrep -f 'findmyjob' > /dev/null; then
            echo "✅ SUCCESS: App is running on port 8080."
          else
            echo "❌ FAILED: App crashed. Check logs below:"
            cat app.log
            exit 1
          fi
