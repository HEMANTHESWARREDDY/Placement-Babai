name: Build and Deploy to EC2

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: Build with Maven
      run: |
        cd backend
        mvn clean package -DskipTests
        
    - name: Upload JAR
      uses: actions/upload-artifact@v4
      with:
        name: findmyjob-backend
        path: backend/target/*.jar

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
    - name: Download JAR
      uses: actions/download-artifact@v4
      with:
        name: findmyjob-backend
        path: target/
        
    - name: Deploy to EC2
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "target/*.jar"
        target: "/home/${{ secrets.EC2_USERNAME }}/app/"
        strip_components: 1

    - name: Restart Service
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          echo "🌐 EC2 Public IP: $(curl -s ifconfig.me)"
          echo "Cleaning up old processes..."
          pkill -f '[f]indmyjob-backend' || true
          sleep 2
          
          echo "Starting application with Secrets..."
          cd $HOME/app/
          rm -f app.log
          
          # Pass the secrets directly to the Java process
          export MONGODB_PASSWORD="${{ secrets.MONGODB_PASSWORD }}"
          export GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"
          
          nohup java -jar *.jar > app.log 2>&1 &
          
          echo "Verifying startup (waiting 20s)..."
          sleep 20
          if pgrep -f '[f]indmyjob-backend' > /dev/null; then
            echo "✅ SUCCESS: App is running on port 8080."
          else
            echo "❌ FAILED: App crashed. Check logs below:"
            cat app.log
            exit 1
          fi
