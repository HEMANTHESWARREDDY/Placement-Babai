name: Build and Deploy to EC2

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: Build with Maven
      run: |
        cd backend
        mvn clean package -DskipTests
        
    - name: Upload JAR
      uses: actions/upload-artifact@v4
      with:
        name: findmyjob-backend
        path: backend/target/*.jar

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
    - name: Download JAR
      uses: actions/download-artifact@v4
      with:
        name: findmyjob-backend
        path: target/
        
    - name: Deploy to EC2
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "target/*.jar"
        target: "/home/${{ secrets.EC2_USERNAME }}/app/"
        strip_components: 1

    - name: Restart Service
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        command_timeout: 10m
        script: |
          # Ensure target directory exists
          mkdir -p /home/${{ secrets.EC2_USERNAME }}/app/
          
          # Install Java 17 if not present (using non-interactive mode)
          if ! command -v java > /dev/null 2>&1; then
            echo "Java not found, installing OpenJDK 17..."
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y openjdk-17-jdk
          fi
          
          # Kill existing process if running
          echo "Stopping existing java processes..."
          sudo pkill -f 'java -jar' || true
          
          # Start the application
          cd /home/${{ secrets.EC2_USERNAME }}/app/
          echo "Starting application..."
          nohup java -jar *.jar > app.log 2>&1 &
          
          # Health check
          echo "Waiting for app to start..."
          sleep 10
          if pgrep -f 'java -jar' > /dev/null; then
            echo "✅ Application started successfully!"
            pgrep -a -f 'java -jar'
          else
            echo "❌ Application failed to start. Check app.log below:"
            cat app.log
            exit 1
          fi
